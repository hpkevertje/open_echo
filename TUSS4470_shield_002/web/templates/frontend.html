<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Spectrogram with Color Map</title>
  <link rel="stylesheet" type="text/css" href="/static/style.css">
</head>
<body>

  <div id="recording-indicator">REC</div>

  <canvas id="spectrogram" class="canvas"></canvas>
  <canvas id="cursor-overlay" class="canvas overlay"></canvas>

  <!-- Floating overlays -->
  <div id="y-axis-labels">
    <div id="y-axis-labels-inner">
      <div id="y-ticks"></div>
      <div class="vertical-label">Depth (m)</div>
      <div id="y-range-selector">
        <span id="y-range-label"></span>
        <div id="y-range-selector-buttons">
          <button id="zoom-in" class="zoom-btn">+</button>
          <button id="zoom-out" class="zoom-btn">-</button>
        </div>
      </div>
    </div>
  </div>

  <div id="top-bar">
    <div id="measured-depth-label">
      Depth: 0m
      <div id="cursor-depth-label">Cursor: -- m</div>
      <div id="depth-status"></div>
    </div>

    <div id="sediment-panel" class="sediment-panel" role="meter"
         aria-label="Bottom hardness" aria-valuemin="0" aria-valuemax="100"
         aria-valuenow="50" aria-valuetext="Unknown" tabindex="0"
         style="display:none;">
      <div class="sediment-scale">
        <span class="sediment-end">HARD</span>
        <div class="sediment-track">
          <div id="sediment-marker" class="sediment-marker"></div>
        </div>
        <span class="sediment-end">SOFT</span>
      </div>
      <div id="sediment-tooltip" class="sediment-tooltip" role="tooltip"></div>
    </div>
  </div>

  <!-- <div id="x-axis-labels">
    <div id="x-ticks"></div>
    <div class="seconds-label">Seconds</div>
  </div> -->

  <script src="/static/js-colormaps.js"></script>
  <script>{% include 'spectrogram.js' %}</script>
</body>
</html>
